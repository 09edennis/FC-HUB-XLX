<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FC Market Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#eaf6ff;
color:#0f172a;
}

header{
background:#0ea5e9;
color:white;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
}

.sub{
text-align:center;
margin-top:10px;
color:#334155;
}

.players{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:30px;
}

.card{
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
transition:0.2s;
}

.card:hover{
transform:translateY(-5px);
}

.card img, .card-img{
width:140px;
height:140px;
object-fit:contain;
display:block;
margin:0 auto 12px auto;
border-radius:12px;
}

.name{
font-size:24px;
font-weight:bold;
margin-top:10px;
}

.price{
color:#0284c7;
font-size:22px;
margin-top:10px;
font-weight:bold;
}

.promo{
background:#0ea5e9;
color:white;
padding:6px 12px;
border-radius:999px;
display:inline-block;
margin-top:10px;
}

.live-users{
text-align:center;
margin-top:20px;
font-weight:bold;
color:#0369a1;
}
</style>
</head>

<body>

<header>FC Market Hub</header>

<div class="sub">
Live EA FC Ultimate Team Market Tracker
</div>

<div class="live-users">
🔥 Live users online: <span id="users">1</span>
</div>

<div class="players" id="players"></div>

<script>

const supabaseUrl = 'https://evjyfmoxtmbkdzpcstku.supabase.co'

const supabaseKey = 'sb_publishable_mEO-txGKV-Q0mE5z-V-6ow_vIG-45-6'

const client = supabase.createClient(supabaseUrl, supabaseKey)

async function loadPlayers(){

const { data, error } = await client
.from('players')
.select('*')

const container = document.getElementById('players')

container.innerHTML = ''

data.forEach(player => {

container.innerHTML += `
<div class="card">
<img src="${player.image}" />
<div class="name">${player.name}</div>
<div>${player.rating} Rated</div>
<div>${player.club}</div>
<div>${player.nation}</div>
<div class="price">
${player.price.toLocaleString()} coins
</div>
<div class="promo">
${player.promo}
</div>
</div>
`
})
}

loadPlayers()

</script>

</body>
</html>
